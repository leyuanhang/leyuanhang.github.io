<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="航神的个人博客 - 分享计算机学习笔记、编程思考和日常感悟">
    <title>关于 - 航哥的博客</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        :root {
            --primary-color: #2563eb;
            --primary-light: #3b82f6;
            --primary-dark: #1d4ed8;
            --secondary-color: #7c3aed;
            --bg-light: #f9fafb;
            --bg-white: #ffffff;
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Roboto, 'Noto Sans', sans-serif;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            color: var(--text-dark);
            line-height: 1.8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Styles */
        header { 
            background: var(--bg-white);
            box-shadow: var(--shadow-md);
            padding: 24px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }

        header h1 { 
            font-size: 2.2em;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        nav a { 
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 8px;
            transition: var(--transition);
            position: relative;
            font-size: 1em;
        }

        nav a:hover {
            color: var(--primary-color);
            background-color: rgba(37, 99, 235, 0.1);
            transform: translateY(-2px);
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 16px;
            right: 16px;
            height: 2px;
            background: var(--primary-color);
            border-radius: 1px;
            transform: scaleX(0);
            transform-origin: right;
            transition: var(--transition);
        }

        nav a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* Main Container */
        .container { 
            max-width: 800px;
            margin: 48px auto;
            padding: 0 20px;
            flex: 1;
        }

        /* Content Card */
        .content { 
            background: var(--bg-white);
            border-radius: 16px;
            padding: 48px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
            transition: var(--transition);
            animation: slideUp 0.6s ease-out;
        }

        .content:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            transform: translateY(-4px);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .content h2 { 
            margin-bottom: 28px;
            font-size: 1.8em;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .content h2::before {
            content: '';
            width: 4px;
            height: 28px;
            background: linear-gradient(180deg, var(--primary-color), var(--secondary-color));
            border-radius: 2px;
        }

        .content p { 
            margin-bottom: 20px;
            color: var(--text-light);
            font-size: 1.05em;
            line-height: 1.9;
        }

        .content p:last-child {
            margin-bottom: 0;
        }

        /* Link Styles */
        a { 
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            position: relative;
            transition: var(--transition);
        }

        a:hover {
            color: var(--secondary-color);
        }

        a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary-color);
            transform: scaleX(0);
            transform-origin: right;
            transition: var(--transition);
        }

        a:hover::after {
            transform: scaleX(1);
            transform-origin: left;
            background: var(--secondary-color);
        }

        /* Footer Styles */
        footer { 
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
            font-size: 0.95em;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.02));
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        footer a {
            color: var(--primary-color);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 32px;
                margin: 0 0;
            }

            .content h2 {
                font-size: 1.5em;
                margin-bottom: 20px;
            }

            .content p {
                font-size: 1em;
            }

            nav a {
                padding: 6px 12px;
                font-size: 0.95em;
            }

            .container {
                margin: 32px auto;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 16px 0;
            }

            header h1 {
                font-size: 1.5em;
                margin-bottom: 12px;
            }

            .container {
                margin: 20px auto;
                padding: 0 16px;
            }

            .content {
                padding: 24px;
                border-radius: 12px;
            }

            .content h2 {
                font-size: 1.3em;
            }

            nav {
                gap: 4px;
            }

            nav a {
                padding: 4px 10px;
                font-size: 0.9em;
            }

            footer {
                padding: 24px 16px;
                font-size: 0.9em;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-light: #111827;
                --bg-white: #1f2937;
                --text-dark: #f3f4f6;
                --text-light: #9ca3af;
                --border-color: #374151;
            }

            body {
                background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            }

            header {
                background: rgba(31, 41, 55, 0.95);
            }

            nav a:hover {
                background-color: rgba(37, 99, 235, 0.2);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>✍️ 航哥的博客</h1>
        <nav>
            <a href="index.html">首页</a>
            <a href="about.html">关于</a>
        </nav>
    </header>
    <div class="container">
        <div class="content">
            <h2>👨‍💻 关于我</h2>
            <p>你好！我是航神，一名大一新生，目前在学习计算机基础知识。</p>
            <p>我建这个博客的初衷很简单：找一个地方安静地写点东西。可能是课堂笔记，可能是对某个问题的想法，可能只是一些琐碎的日志。</p>
            <p>这个网站完全由 HTML 写成的，部署在 GitHub Pages 上，永久免费，不需要任何服务器。</p>
            <p>技术虽简单，但足够用来表达自己。</p>
            <p>欢迎留言交流（也许以后可以加上评论区）。</p>
        </div>
    </div>
    <footer>© 2025 航神的博客 · <a href="index.html">返回首页</a></footer>
</body>
</html>
